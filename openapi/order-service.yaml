openapi: 3.1.0
info: {title: Boutique Order Service API, version: 1.0.0}
servers: [{url: http://localhost:8084}]
paths:
  /api/v1/orders:
    post: {summary: Create an idempotent pending order, responses: {'201': {description: Created}}}
  /api/v1/orders/{orderId}:
    get:
      parameters: [{name: orderId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Order}}
