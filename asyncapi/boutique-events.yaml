asyncapi: 3.0.0
info:
  title: Boutique Domain Events
  version: 1.0.0
channels:
  orderConfirmed:
    address: order.confirmed
    messages:
      orderConfirmed:
        payload:
          type: object
          required: [orderId, userId, paymentId, total, currency, occurredAt]
          properties:
            orderId: {type: string, format: uuid}
            userId: {type: string, format: uuid}
            paymentId: {type: string, format: uuid}
            total: {type: number}
            currency: {type: string}
            occurredAt: {type: string, format: date-time}
operations:
  publishOrderConfirmed:
    action: send
    channel: {$ref: '#/channels/orderConfirmed'}
  consumeOrderConfirmed:
    action: receive
    channel: {$ref: '#/channels/orderConfirmed'}
